services:
  - type: web
    name: function-backend
    branch: main
    runtime: python
    plan: free
    region: frankfurt
    rootDir: function_backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finaris-db
          property: connectionString
      - key: PAYMENT_CARD_NUMBER
        sync: false
      - key: PAYMENT_CARD_HOLDER
        sync: false
      - key: PAYMENT_TELEGRAM_URL
        sync: false
      - key: SEED_FUNCTION_DATA
        value: "true"
databases:
  - name: finaris-db
    plan: free
    region: frankfurt
